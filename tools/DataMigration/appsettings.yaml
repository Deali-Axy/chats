Logging:
  LogLevel:
    Default: Information
ConnectionStrings:
  SQLite: "Data Source=app.db;"
AppSettings:
  Name: "DataMigration"
  Boolean: true
  DemoList: []
Etl:
  Job: ProdSqliteV111ToV115
  # Paths are relative to the repo root (directory that contains Chats.slnx).
  SourceDb: temp/server-data/v2-new/backup-08-20.db
  TargetDb: src/BE/web/AppData/chats.migrated.db
  FinalDb: src/BE/web/AppData/chats.db
  SkipRequestTrace: false
  SwapToFinal: true