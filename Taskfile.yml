# https://taskfile.dev
version: '3'

vars:
  FE_DIR: ./src/FE
  BE_DIR: ./src/BE/web
  BE_PROJECT: Chats.BE.csproj
  BE_CSProj: ./src/BE/web/Chats.BE.csproj
  EF_CONTEXT: ChatsDB
  EF_OUT: DB/Migrations

tasks:
  default:
    desc: 显示所有可用任务
    cmds:
      - task --list

  install:
    desc: 安装前端 pnpm 依赖并还原后端 NuGet 包
    cmds:
      - task: install:fe
      - task: install:be

  install:fe:
    desc: 安装前端依赖（pnpm，src/FE/package.json）
    dir: '{{.FE_DIR}}'
    cmds:
      - pnpm install

  install:be:
    desc: 还原后端 NuGet 包（src/BE/web）
    dir: '{{.BE_DIR}}'
    cmds:
      - dotnet restore {{.BE_PROJECT}}

  dev:
    desc: 同时启动前端和后端开发服务器 (使用 goreman)
    cmds:
      - goreman -f Procfile start

  dev:fe:
    desc: 启动前端开发服务器 (Next.js / pnpm)
    dir: '{{.FE_DIR}}'
    cmds:
      - pnpm run dev

  dev:be:
    desc: 启动后端开发服务器 (ASP.NET Core，启动时自动 Migrate)
    dir: '{{.BE_DIR}}'
    cmds:
      - dotnet run --project {{.BE_PROJECT}}

  build:
    desc: 构建前端和后端项目
    cmds:
      - task: build:fe
      - task: build:be

  generate:poster:
    desc: 从 git 历史生成海报数据（可传版本号，如：task generate:poster -- 1.13.0）
    cmds:
      - python scripts/generate_poster_data.py {{.CLI_ARGS}}

  build:fe:
    desc: 构建前端项目
    dir: '{{.FE_DIR}}'
    cmds:
      - pnpm run build

  build:be:
    desc: 构建后端项目
    dir: '{{.BE_DIR}}'
    cmds:
      - dotnet build {{.BE_PROJECT}}

  test:
    desc: 运行所有测试
    cmds:
      - task: test:be

  test:be:
    desc: 运行后端单元测试
    cmds:
      - dotnet test src/BE/tests/Chats.BE.UnitTest/Chats.BE.UnitTest.csproj

  # --- EF Core migrations (SQLite only) ---

  tools:restore:
    desc: 还原本地 .NET 工具（含 dotnet-ef）
    cmds:
      - dotnet tool restore

  ef:add:
    desc: 新增 EF migration（用法：task ef:add -- AddSomething）
    deps: [tools:restore]
    cmds:
      - |
        {{if not .CLI_ARGS}}echo "Usage: task ef:add -- <MigrationName>" && exit 1{{end}}
        dotnet tool run dotnet-ef migrations add {{.CLI_ARGS}} --project {{.BE_CSProj}} --startup-project {{.BE_CSProj}} --context {{.EF_CONTEXT}} --output-dir {{.EF_OUT}}

  ef:update:
    desc: 将数据库更新到最新 migration（空库会建表；启动时也会自动 Migrate）
    deps: [tools:restore]
    cmds:
      - dotnet tool run dotnet-ef database update --project {{.BE_CSProj}} --startup-project {{.BE_CSProj}} --context {{.EF_CONTEXT}}

  ef:list:
    desc: 列出 EF migrations
    deps: [tools:restore]
    cmds:
      - dotnet tool run dotnet-ef migrations list --project {{.BE_CSProj}} --startup-project {{.BE_CSProj}} --context {{.EF_CONTEXT}}

  ef:remove:
    desc: 删除最近一次未应用的 migration（慎用）
    deps: [tools:restore]
    cmds:
      - dotnet tool run dotnet-ef migrations remove --project {{.BE_CSProj}} --startup-project {{.BE_CSProj}} --context {{.EF_CONTEXT}}

  clean:
    desc: 清理构建产物
    cmds:
      - task: clean:fe
      - task: clean:be

  clean:fe:
    desc: 清理前端构建产物
    dir: '{{.FE_DIR}}'
    cmds:
      - rm -rf .next out node_modules

  clean:be:
    desc: 清理后端构建产物
    cmds:
      - dotnet clean

  deploy:
    desc: 构建并部署到服务器 (调用 scripts/build_push.py)
    cmds:
      - python scripts/build_push.py
